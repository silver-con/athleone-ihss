<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Hearth</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8f4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#2b2a28;padding:24px;box-sizing:border-box}
  .card{max-width:360px;text-align:center}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#6b665f;font-size:15px;line-height:1.5}
  button{margin-top:12px;background:#23776d;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Hearth needs a connection to show your visits and record clock-in and clock-out. Check your signal or Wi-Fi and try again.</p>
    <p>If a visit is starting now and you can't connect, call your agency office so they can note the time.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
